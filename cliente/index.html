<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Editar minha página</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../img/nfcliente-icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/perfil.css">
  <link rel="stylesheet" href="../admin/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <!-- PIN (pedido toda vez que o link é aberto) -->
  <section id="telaPin" class="tela-login">
    <form id="formPin" class="caixa-login" novalidate>
      <img class="logo-marca" src="../img/nfcliente-icone.svg" alt="NFCliente" width="56" height="56">
      <h1>Editar minha página</h1>
      <p class="sub" id="pinTexto">Digite os 4 últimos dígitos do seu telefone cadastrado.</p>
      <label>PIN <input type="password" id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required></label>
      <p class="erro" id="pinErro" role="alert"></p>
      <button class="btn primario largo" type="submit" id="btnEntrar"><i class="fa-solid fa-unlock"></i> Entrar</button>
    </form>
    <div id="caixaAviso" class="caixa-login" hidden>
      <div class="logo"><i class="fa-solid fa-link-slash"></i></div>
      <h1 id="avisoTitulo">Link indisponível</h1>
      <p class="sub" id="avisoTexto"></p>
    </div>
  </section>

  <!-- EDITOR -->
  <main id="telaEditor" class="editor" hidden>
    <div class="editor-topo">
      <a class="btn fantasma" id="btnVerPagina" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver minha página</a>
      <div class="editor-titulo"><h1 id="edTitulo"></h1></div>
      <div class="editor-acoes">
        <span class="salvo" id="edSalvo"></span>
        <button class="btn" id="btnPrevia" type="button"><i class="fa-solid fa-mobile-screen"></i> Prévia</button>
        <button class="btn primario" id="btnSalvar" type="button"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
      </div>
    </div>
    <div class="editor-corpo">
      <form id="formEditor" class="editor-form" autocomplete="off"></form>
      <aside class="previa" id="previa" aria-label="Prévia">
        <div class="previa-topo">
          <span>Prévia</span>
          <button class="btn fantasma pequeno" id="btnFecharPrevia" type="button"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="celular"><div class="celular-tela" id="previaTela"></div></div>
      </aside>
    </div>
  </main>

  <div id="modais"></div>
  <div class="toast-admin" id="toastAdmin" role="status"></div>

  <!-- Sem biblioteca de login: só o editor e as consultas do link do cliente -->
  <script src="../js/lib/qrcode-1.0.0.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/perfil-render.js"></script>
  <script src="../js/editor-perfil.js"></script>
  <script src="cliente.js"></script>
</body>
</html>
