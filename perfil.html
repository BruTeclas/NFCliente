<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Carregando…</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/img/nfcliente-icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0f0f14">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/perfil.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    html, body { margin: 0; min-height: 100%; background: #0f0f14; }
    #app, #app > .perfil { min-height: 100vh; }
    .carregando { min-height: 100vh; display: grid; place-items: center; }
    .carregando::after {
      content: ""; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; animation: gira .8s linear infinite;
    }
    @keyframes gira { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div class="carregando" aria-label="Carregando"></div></div>

  <!-- Página pública: sem biblioteca de login. Só lê o perfil (js/publico.js). -->
  <script src="/js/lib/qrcode-1.0.0.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/perfil-render.js"></script>
  <script src="/js/publico.js"></script>
  <script src="/js/pagina-perfil.js"></script>
</body>
</html>
