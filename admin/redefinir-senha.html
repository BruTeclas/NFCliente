<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- O link do e-mail traz um código na URL: não repassar o endereço para outros sites -->
  <meta name="referrer" content="no-referrer">
  <title>Definir senha · Painel</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../img/nfcliente-icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
  <section class="tela-login">
    <form id="formSenha" class="caixa-login" novalidate>
      <div class="logo"><i class="fa-solid fa-lock"></i></div>
      <h1 id="titulo">Defina uma nova senha</h1>
      <p class="sub" id="subtitulo">Escolha uma senha que você não usa em outros sites.</p>

      <div id="camposSenha">
        <label>Nova senha
          <span class="campo-senha">
            <input type="password" id="senha" autocomplete="new-password" required>
            <button type="button" class="mostrar-senha" id="mostrar" aria-label="Mostrar senha"><i class="fa-regular fa-eye"></i></button>
          </span>
        </label>
        <label>Repita a nova senha <input type="password" id="confirmar" autocomplete="new-password" required></label>
        <ul class="regras-senha" id="regras"></ul>
        <p class="erro" id="erro" role="alert"></p>
        <button class="btn primario largo" type="submit" id="btnSalvar"><i class="fa-solid fa-check"></i> Salvar senha</button>
      </div>

      <div id="aviso" class="aviso-senha" hidden>
        <p id="avisoTexto"></p>
        <a class="btn primario largo" id="avisoBotao" href="./"></a>
      </div>
    </form>
  </section>

  <script src="../js/lib/supabase-js-2.117.2.js"></script>
  <script src="../js/config.js"></script>
  <script src="redefinir-senha.js"></script>
</body>
</html>
